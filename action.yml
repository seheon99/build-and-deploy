name: Docker Service Continuous Deployment (Compose + SSH)
description: >
  Build, sign, and deploy Docker images with digest-based updates,
  and remotely deploy services via docker-compose over SSH.

inputs:
  skip-checkout:
    required: false
    default: "false"
    description: >
      Skip the repository checkout step;
      assumes the caller already checked out the repo and prepared the workspace
  dry-run:
    required: false
    default: "false"
    description: Run pipeline without pushing or deploying artifacts

  registry:
    required: false
    description: Image name (e.g. ghcr.io/user/repo)
  service-name:
    required: false
    description: Docker Compose service name

  ssh-host:
    required: false
  ssh-user:
    required: false
  ssh-key:
    required: false
  ssh-port:
    required: false
    default: "22"
  context:
    required: false
    default: "."
    description: Docker build context path (e.g. frontend, backend)
  dockerfile:
    required: false
    default: ""
    description: >
      Path to Dockerfile. Defaults to {context}/Dockerfile when not set.
  build-args:
    required: false
    default: ""
    description: >
      List of build-time variables passed to docker/build-push-action,
      one KEY=VALUE per line.

runs:
  using: composite
  steps:
    - name: Validate required inputs (non dry-run)
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        SERVICE_NAME: ${{ inputs.service-name }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        missing=()
        [[ -z "$REGISTRY" ]] && missing+=("registry")
        [[ -z "$SERVICE_NAME" ]] && missing+=("service-name")
        [[ -z "$SSH_HOST" ]] && missing+=("ssh-host")
        [[ -z "$SSH_USER" ]] && missing+=("ssh-user")
        [[ -z "$SSH_KEY" ]] && missing+=("ssh-key")
        if (( ${#missing[@]} )); then
          echo "Missing required inputs for non-dry-run: ${missing[*]}" >&2
          exit 1
        fi

    - if: inputs.skip-checkout != 'true'
      uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - if: inputs.dry-run != 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry }}

    - id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
        build-args: ${{ inputs.build-args }}
        push: ${{ inputs.dry-run != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - if: inputs.dry-run != 'true'
      uses: sigstore/cosign-installer@v4.1.2

    - name: Sign the published Docker image (skip on dry-run)
      if: inputs.dry-run != 'true'
      env:
        IMAGE: ${{ inputs.registry }}
        DIGEST: ${{ steps.build.outputs.digest }}
      shell: bash
      run: cosign sign --yes "${IMAGE}@${DIGEST}"

    - name: Resolve and validate published image
      id: image
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        IMAGE: ''
        REGISTRY: ${{ inputs.registry }}
        DIGEST: ${{ steps.build.outputs.digest }}
        SERVICE_NAME: ${{ inputs.service-name }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KEY: ${{ inputs.ssh-key }}
        WORKING_DIRECTORY: '.'
        COMPOSE_FILE: ''
        ENV_FILE: '.env'
      run: |
        if [[ -z "$IMAGE" ]]; then
          IMAGE="${REGISTRY}@${DIGEST}"
        elif [[ ( -n "$REGISTRY" && "$REGISTRY" != "${IMAGE%@*}" ) ||
                ( -n "$DIGEST" && "$DIGEST" != "${IMAGE##*@}" ) ]]; then
          echo 'image conflicts with registry or digest' >&2
          exit 1
        fi
        if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$ ]]; then
          echo 'Provide image as repository@sha256:digest, or registry and digest' >&2
          exit 1
        fi
        if [[ ! "$SERVICE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
          echo 'Provide a valid Docker Compose service-name' >&2
          exit 1
        fi
        if [[ -z "$SSH_HOST" || -z "$SSH_USER" || -z "$SSH_KEY" ]]; then
          echo 'ssh-host, ssh-user, and ssh-key are required' >&2
          exit 1
        fi
        VARIABLE=$(echo "$SERVICE_NAME" | tr '[:lower:]-' '[:upper:]_' | sed 's/_\+/_/g')
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "digest=${IMAGE##*@}" >> "$GITHUB_OUTPUT"
        echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
        echo "variable=$VARIABLE" >> "$GITHUB_OUTPUT"
        # Encode paths so quotes and shell metacharacters remain data in the SSH script.
        for key in WORKING_DIRECTORY COMPOSE_FILE ENV_FILE; do
          encoded=$(printf '%s' "${!key}" | base64 -w0)
          if [[ -n "$encoded" ]]; then
            echo "::add-mask::$encoded"
          fi
          echo "${key,,}=$encoded" >> "$GITHUB_OUTPUT"
        done

    - name: Deploy over SSH
      if: inputs.dry-run != 'true'
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        key: ${{ inputs.ssh-key }}
        port: ${{ inputs.ssh-port }}
        script: |
          set -eu
          WORKING_DIRECTORY=$(printf '%s' '${{ steps.image.outputs.working_directory }}' | base64 -d)
          COMPOSE_FILE=$(printf '%s' '${{ steps.image.outputs.compose_file }}' | base64 -d)
          ENV_FILE=$(printf '%s' '${{ steps.image.outputs.env_file }}' | base64 -d)
          cd -- "$WORKING_DIRECTORY"
          test -f "$ENV_FILE"
          DIGEST_KEY='${{ steps.image.outputs.variable }}_IMAGE_DIGEST'
          if ! grep -q -- "^${DIGEST_KEY}=" "$ENV_FILE"; then
            echo "Missing required digest variable: $DIGEST_KEY" >&2
            exit 1
          fi
          CANDIDATE=$(mktemp -- "${ENV_FILE}.XXXXXX")
          trap 'rm -f -- "$CANDIDATE"' EXIT
          trap 'exit 1' HUP INT TERM
          cp -p -- "$ENV_FILE" "$CANDIDATE"
          for entry in '${{ steps.image.outputs.variable }}_IMAGE_DIGEST=${{ steps.image.outputs.digest }}' '${{ steps.image.outputs.variable }}_IMAGE=${{ steps.image.outputs.image }}'; do
            key=${entry%%=*}
            if grep -q -- "^${key}=" "$CANDIDATE"; then
              sed -i "s|^${key}=.*|${entry}|" -- "$CANDIDATE"
            else
              printf '\n%s\n' "$entry" >> "$CANDIDATE"
            fi
          done
          # Candidate values take precedence over stale SSH environment variables.
          set -- env '${{ steps.image.outputs.variable }}_IMAGE_DIGEST=${{ steps.image.outputs.digest }}' \
            '${{ steps.image.outputs.variable }}_IMAGE=${{ steps.image.outputs.image }}' \
            docker compose --env-file "$CANDIDATE"
          if [ -n "$COMPOSE_FILE" ]; then
            set -- "$@" -f "$COMPOSE_FILE"
          fi
          "$@" config --quiet
          mv -f -- "$CANDIDATE" "$ENV_FILE"
          set -- env '${{ steps.image.outputs.variable }}_IMAGE_DIGEST=${{ steps.image.outputs.digest }}' \
            '${{ steps.image.outputs.variable }}_IMAGE=${{ steps.image.outputs.image }}' \
            docker compose --env-file "$ENV_FILE"
          if [ -n "$COMPOSE_FILE" ]; then
            set -- "$@" -f "$COMPOSE_FILE"
          fi
          "$@" pull '${{ steps.image.outputs.service_name }}'
          "$@" up -d --no-deps --no-build '${{ steps.image.outputs.service_name }}'
